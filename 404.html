<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tahle stránka tu není | Do USA bez cestovky</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Poppins', system-ui, sans-serif;
    background: #F5FAFC;
    color: #14233A;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    background: #fff;
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 460px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(20, 35, 58, .08);
  }
  .znak { font-size: 44px; font-weight: 800; color: #1AC0CE; margin-bottom: 8px; }
  h1 { font-size: 22px; font-weight: 800; margin-bottom: 14px; }
  p { font-size: 15.5px; line-height: 1.7; color: #55637A; margin-bottom: 26px; }
  a {
    display: inline-block;
    background: #1AC0CE;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 999px;
  }
  a:hover { background: #0B7C87; }
</style>
</head>
<body>
  <div class="box">
    <div class="znak">404</div>
    <h1>Tahle stránka tu není.</h1>
    <p>Buď se přejmenovala, nebo v odkazu chybí písmenko. Zpátky do průvodce vede tohle tlačítko.</p>
    <a href="/">Zpátky do průvodce</a>
  </div>
</body>
</html>
