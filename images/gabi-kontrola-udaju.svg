<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Gábi se dívá pozorně do notebooku, prst na obrazovce, soustředěný
       klidný výraz, bez brýlí. Stejná postava jako gabi-happy-plaz.svg
       (hlava r=76 na (200,178), stejná kšiltovka), jen jiné paže, výraz
       a rekvizita. Pozadí je průhledné, scéna oříznutá do kolečka. -->

  <clipPath id="kuKolo"><circle cx="200" cy="200" r="185"/></clipPath>

  <g clip-path="url(#kuKolo)">
    <!-- obloha -->
    <rect x="0" y="0" width="400" height="400" fill="#E6F8FA"/>
    <circle cx="336" cy="76" r="22" fill="#FFD23F"/>

    <!-- stůl -->
    <rect x="0" y="330" width="400" height="70" fill="#CBD6DE"/>

    <!-- levá paže dolů k noteboku -->
    <g fill="none" stroke-linecap="round">
      <path d="M148 274 Q126 306 152 332" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M148 274 Q126 306 152 332" stroke="#FFE0CC" stroke-width="20"/>
    </g>

    <!-- pravá paže dolů, prst míří na displej -->
    <g fill="none" stroke-linecap="round">
      <path d="M252 274 Q276 300 250 322" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M252 274 Q276 300 250 322" stroke="#FFE0CC" stroke-width="20"/>
    </g>

    <!-- tělo: tričko -->
    <path d="M118 385 L118 302 Q118 254 166 252 L234 252 Q282 254 282 302 L282 385 Z" fill="#1AC0CE"/>
    <path d="M176 254 L200 292 L224 254 Z" fill="#F4FBFC"/>

    <!-- notebook -->
    <g transform="translate(200 336)">
      <path d="M-78 24 L-64 -30 Q-62 -36 -55 -36 L55 -36 Q62 -36 64 -30 L78 24 Z" fill="#14233A"/>
      <rect x="-58" y="-30" width="116" height="48" rx="3" fill="#F4FBFC"/>
      <!-- řádky textu a fajfka -->
      <line x1="-46" y1="-18" x2="10" y2="-18" stroke="#B9C6CE" stroke-width="3" stroke-linecap="round"/>
      <line x1="-46" y1="-8" x2="26" y2="-8" stroke="#B9C6CE" stroke-width="3" stroke-linecap="round"/>
      <line x1="-46" y1="2" x2="0" y2="2" stroke="#B9C6CE" stroke-width="3" stroke-linecap="round"/>
      <circle cx="34" cy="4" r="12" fill="#1AC0CE"/>
      <path d="M28 4 L33 10 L42 -2" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-84 26 L84 26 L94 40 Q96 46 88 46 L-88 46 Q-96 46 -94 40 Z" fill="#CBD6DE"/>
    </g>
    <circle cx="152" cy="330" r="15" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>
    <circle cx="250" cy="320" r="14" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>

    <!-- vlasy -->
    <path d="M200 88 Q286 88 288 186 Q290 248 272 276 Q256 254 262 206 Q262 138 200 134
             Q138 138 138 206 Q144 254 128 276 Q110 248 112 186 Q114 88 200 88 Z" fill="#2A3550"/>

    <!-- hlava, mírně skloněná dopředu k obrazovce -->
    <g transform="rotate(-4 200 178) translate(0 6)">
      <circle cx="200" cy="178" r="76" fill="#FFE0CC"/>

      <!-- kšiltovka -->
      <clipPath id="kuKstil"><path d="M116 130 Q116 58 200 58 Q284 58 284 130 Z"/></clipPath>
      <g clip-path="url(#kuKstil)">
        <rect x="104" y="58" width="192" height="22" fill="#F4FBFC"/>
        <rect x="104" y="80" width="192" height="13" fill="#FF6FA5"/>
        <rect x="104" y="93" width="192" height="6"  fill="#FFD23F"/>
        <rect x="104" y="99" width="192" height="13" fill="#F4FBFC"/>
        <rect x="104" y="112" width="192" height="18" fill="#1AC0CE"/>
      </g>
      <path d="M116 130 Q116 58 200 58 Q284 58 284 130" fill="none" stroke="#14233A" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="200" cy="62" r="6" fill="#14233A"/>
      <path d="M108 128 Q200 172 292 128 Z" fill="#0E8C97" stroke="#14233A" stroke-width="3" stroke-linejoin="round"/>

      <!-- obočí, jedno mírně zvednuté, soustředění -->
      <path d="M150 158 Q168 148 186 158" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M250 160 Q232 154 214 160" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- oči, pohled dolů na displej, bez brýlí -->
      <path d="M160 192 Q168 198 178 192" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M222 192 Q232 198 240 192" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- pusa, klidná, semknutá -->
      <path d="M180 228 Q200 232 220 228" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

      <!-- tváře -->
      <ellipse cx="146" cy="212" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>
      <ellipse cx="254" cy="212" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>
    </g>
  </g>

  <!-- hvězdičky -->
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="15" fill="#1AC0CE">&#10022;</text>
</svg>
