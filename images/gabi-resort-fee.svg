<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Gábi si lupou prohlíží účtenku/rezervaci, na ní zvýrazněná skrytá
       položka (resort fee). Stejná postava jako gabi-happy-plaz.svg (hlava
       r=76 na (200,178), stejná kšiltovka), jen jiné paže, rekvizita a
       pozorný výraz bez brýlí. Pozadí průhledné, scéna oříznutá do kolečka. -->

  <clipPath id="rfKolo"><circle cx="200" cy="200" r="185"/></clipPath>

  <g clip-path="url(#rfKolo)">
    <rect x="0" y="0" width="400" height="400" fill="#E6F8FA"/>
    <circle cx="330" cy="80" r="22" fill="#FFD23F"/>

    <!-- levá paže drží účtenku -->
    <g fill="none" stroke-linecap="round">
      <path d="M148 274 Q128 302 154 328" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M148 274 Q128 302 154 328" stroke="#FFE0CC" stroke-width="20"/>
    </g>
    <!-- pravá paže drží lupu nad účtenkou -->
    <g fill="none" stroke-linecap="round">
      <path d="M252 274 Q286 270 288 232" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M252 274 Q286 270 288 232" stroke="#FFE0CC" stroke-width="20"/>
    </g>

    <!-- tělo -->
    <path d="M118 385 L118 302 Q118 254 166 252 L234 252 Q282 254 282 302 L282 385 Z" fill="#1AC0CE"/>
    <path d="M176 254 L200 292 L224 254 Z" fill="#F4FBFC"/>

    <!-- účtenka -->
    <g transform="translate(160 330) rotate(-4)">
      <rect x="-34" y="-40" width="68" height="80" fill="#F4FBFC" stroke="#14233A" stroke-width="3"/>
      <line x1="-22" y1="-24" x2="22" y2="-24" stroke="#B9C6CE" stroke-width="3" stroke-linecap="round"/>
      <line x1="-22" y1="-10" x2="22" y2="-10" stroke="#B9C6CE" stroke-width="3" stroke-linecap="round"/>
      <line x1="-22" y1="4" x2="10" y2="4" stroke="#FF6FA5" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-22" y1="18" x2="22" y2="18" stroke="#B9C6CE" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="154" cy="330" r="15" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>

    <circle cx="288" cy="230" r="15" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>

    <!-- vlasy -->
    <path d="M200 88 Q286 88 288 186 Q290 248 272 276 Q256 254 262 206 Q262 138 200 134
             Q138 138 138 206 Q144 254 128 276 Q110 248 112 186 Q114 88 200 88 Z" fill="#2A3550"/>

    <!-- hlava -->
    <circle cx="200" cy="178" r="76" fill="#FFE0CC"/>

    <!-- kšiltovka -->
    <clipPath id="rfKstil"><path d="M116 130 Q116 58 200 58 Q284 58 284 130 Z"/></clipPath>
    <g clip-path="url(#rfKstil)">
      <rect x="104" y="58" width="192" height="22" fill="#F4FBFC"/>
      <rect x="104" y="80" width="192" height="13" fill="#FF6FA5"/>
      <rect x="104" y="93" width="192" height="6"  fill="#FFD23F"/>
      <rect x="104" y="99" width="192" height="13" fill="#F4FBFC"/>
      <rect x="104" y="112" width="192" height="18" fill="#1AC0CE"/>
    </g>
    <path d="M116 130 Q116 58 200 58 Q284 58 284 130" fill="none" stroke="#14233A" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="200" cy="62" r="6" fill="#14233A"/>
    <path d="M108 128 Q200 172 292 128 Z" fill="#0E8C97" stroke="#14233A" stroke-width="3" stroke-linejoin="round"/>

    <!-- obočí, jedno zvednuté, "aha, tady to je" -->
    <path d="M148 152 Q168 140 188 154" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M250 158 Q232 152 214 160" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- oči, bez brýlí, pozorný pohled -->
    <path d="M152 190 Q168 196 186 190" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M214 190 Q232 196 248 190" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- pusa, mírný "aha" úsměv -->
    <path d="M180 226 Q200 234 220 224" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- tváře -->
    <ellipse cx="146" cy="212" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>
    <ellipse cx="254" cy="212" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>

    <!-- lupa, kreslená až navrch, ať ji nepřekryjí vlasy -->
    <g transform="translate(258 202) rotate(24)">
      <circle cx="0" cy="0" r="22" fill="#CDEFF3" fill-opacity="0.7" stroke="#14233A" stroke-width="5"/>
      <line x1="15" y1="15" x2="34" y2="34" stroke="#14233A" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
