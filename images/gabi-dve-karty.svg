<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Gábi drží v každé ruce jednu platební kartu, sebejistý výraz.
       Stejná postava jako gabi-happy-plaz.svg (hlava r=76 na (200,178),
       stejná kšiltovka), jen jiné paže, rekvizita a scéna. Pozadí
       průhledné, scéna oříznutá do kolečka. -->

  <clipPath id="dkKolo"><circle cx="200" cy="200" r="185"/></clipPath>

  <g clip-path="url(#dkKolo)">
    <rect x="0" y="0" width="400" height="400" fill="#E6F8FA"/>
    <circle cx="200" cy="72" r="22" fill="#FFD23F"/>

    <!-- tělo -->
    <path d="M118 385 L118 302 Q118 254 166 252 L234 252 Q282 254 282 302 L282 385 Z" fill="#1AC0CE"/>
    <path d="M176 254 L200 292 L224 254 Z" fill="#F4FBFC"/>

    <!-- paže, obě ven a nahoru, gesto "mám dvě" -->
    <g fill="none" stroke-linecap="round">
      <path d="M148 274 Q112 264 96 224" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M252 274 Q288 264 304 224" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M148 274 Q112 264 96 224" stroke="#FFE0CC" stroke-width="20"/>
      <path d="M252 274 Q288 264 304 224" stroke="#FFE0CC" stroke-width="20"/>
    </g>
    <circle cx="92" cy="216" r="16" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>
    <circle cx="308" cy="216" r="16" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>

    <!-- vlasy -->
    <path d="M200 88 Q286 88 288 186 Q290 248 272 276 Q256 254 262 206 Q262 138 200 134
             Q138 138 138 206 Q144 254 128 276 Q110 248 112 186 Q114 88 200 88 Z" fill="#2A3550"/>

    <!-- hlava -->
    <circle cx="200" cy="178" r="76" fill="#FFE0CC"/>

    <!-- kšiltovka -->
    <clipPath id="dkKstil"><path d="M116 130 Q116 58 200 58 Q284 58 284 130 Z"/></clipPath>
    <g clip-path="url(#dkKstil)">
      <rect x="104" y="58" width="192" height="22" fill="#F4FBFC"/>
      <rect x="104" y="80" width="192" height="13" fill="#FF6FA5"/>
      <rect x="104" y="93" width="192" height="6"  fill="#FFD23F"/>
      <rect x="104" y="99" width="192" height="13" fill="#F4FBFC"/>
      <rect x="104" y="112" width="192" height="18" fill="#1AC0CE"/>
    </g>
    <path d="M116 130 Q116 58 200 58 Q284 58 284 130" fill="none" stroke="#14233A" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="200" cy="62" r="6" fill="#14233A"/>
    <path d="M108 128 Q200 172 292 128 Z" fill="#0E8C97" stroke="#14233A" stroke-width="3" stroke-linejoin="round"/>

    <!-- obočí sebejisté -->
    <path d="M150 160 Q168 152 186 160" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M250 160 Q232 152 214 160" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- oči, bez brýlí -->
    <path d="M152 190 Q168 196 186 190" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M214 190 Q232 196 248 190" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- pusa, sebejistý úsměv -->
    <path d="M172 224 Q200 236 228 224" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- tváře -->
    <ellipse cx="140" cy="214" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>
    <ellipse cx="260" cy="214" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>

    <!-- dvě karty, kresleny navrch, ať je nepřekryjí vlasy -->
    <g transform="translate(84 200) rotate(-18)">
      <rect x="-24" y="-15" width="48" height="30" rx="5" fill="#FF6FA5" stroke="#14233A" stroke-width="3"/>
      <rect x="-24" y="-6" width="48" height="7" fill="#14233A" opacity="0.8"/>
    </g>
    <g transform="translate(316 200) rotate(18)">
      <rect x="-24" y="-15" width="48" height="30" rx="5" fill="#1AC0CE" stroke="#14233A" stroke-width="3"/>
      <rect x="-24" y="-6" width="48" height="7" fill="#14233A" opacity="0.8"/>
    </g>
  </g>
</svg>
