<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Ikona: Checklisty. Podložka se seznamem, dvě odškrtnuté položky. -->
  <rect x="0" y="0" width="400" height="400" fill="#FFFFFF"/>
  <circle cx="200" cy="200" r="185" fill="#E6F8FA"/>

  <text x="75" y="100" font-family="Arial, sans-serif" font-size="18" fill="#FF6FA5">&#10022;</text>
  <text x="310" y="300" font-family="Arial, sans-serif" font-size="16" fill="#1AC0CE">&#10022;</text>

  <!-- podložka -->
  <rect x="112" y="98" width="176" height="216" rx="18" fill="#14233A"/>
  <!-- papír -->
  <rect x="130" y="120" width="140" height="176" rx="10" fill="#F4FBFC"/>

  <!-- klip nahoře -->
  <rect x="170" y="80" width="60" height="32" rx="12" fill="#FFD23F" stroke="#14233A" stroke-width="7"/>

  <!-- řádek 1: odškrtnuto -->
  <path d="M148 160 l9 11 l19 -23" fill="none" stroke="#1AC0CE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="188" y1="160" x2="252" y2="160" stroke="#14233A" stroke-width="8" stroke-linecap="round" opacity="0.35"/>

  <!-- řádek 2: odškrtnuto -->
  <path d="M148 208 l9 11 l19 -23" fill="none" stroke="#1AC0CE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="188" y1="208" x2="240" y2="208" stroke="#14233A" stroke-width="8" stroke-linecap="round" opacity="0.35"/>

  <!-- řádek 3: čeká -->
  <rect x="144" y="244" width="26" height="26" rx="7" fill="none" stroke="#FF6FA5" stroke-width="7"/>
  <line x1="188" y1="257" x2="250" y2="257" stroke="#14233A" stroke-width="8" stroke-linecap="round"/>
</svg>
