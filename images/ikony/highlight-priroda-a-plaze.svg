  </g>
  <g fill="#1AC0CE">
    <path d="M210 190 Q170 150 120 158 Q168 172 210 198 Z"/>
    <path d="M210 190 Q190 130 140 108 Q182 138 216 196 Z"/>
    <path d="M210 190 Q248 130 300 118 Q252 142 216 196 Z"/>
  </g>
  <g fill="#FF6FA5">
    <path d="M210 190 Q220 122 200 74 Q226 130 218 196 Z"/>
    <path d="M210 190 Q258 152 292 168 Q244 168 214 198 Z"/>
  </g>

  <!-- kokosy -->
  <circle cx="202" cy="204" r="9" fill="#FF6FA5" stroke="#14233A" stroke-width="3"/>
  <circle cx="216" cy="210" r="9" fill="#FFD23F" stroke="#14233A" stroke-width="3"/>
