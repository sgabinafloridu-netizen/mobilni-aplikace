  <circle cx="200" cy="200" r="185" fill="#E6F8FA"/>

  <!-- sluníčko -->
  <circle cx="278" cy="110" r="34" fill="#FFD23F"/>
  <line x1="278" y1="60" x2="278" y2="44" stroke="#FFD23F" stroke-width="7" stroke-linecap="round"/>
  <line x1="322" y1="110" x2="338" y2="110" stroke="#FFD23F" stroke-width="7" stroke-linecap="round"/>
  <line x1="309" y1="79" x2="320" y2="68" stroke="#FFD23F" stroke-width="7" stroke-linecap="round"/>
  <line x1="309" y1="141" x2="320" y2="152" stroke="#FFD23F" stroke-width="7" stroke-linecap="round"/>

  <!-- vlnky -->
  <path d="M60 300 Q90 284 120 300 T180 300" stroke="#1AC0CE" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M60 322 Q90 306 120 322 T180 322" stroke="#1AC0CE" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- kmen palmy -->
