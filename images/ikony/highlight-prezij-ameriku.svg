<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Highlight cover: Přežij Ameriku. Čistá ikona bez postavy — kompas. -->
  <rect x="0" y="0" width="400" height="400" fill="#FFFFFF"/>
  <circle cx="200" cy="200" r="185" fill="#E6F8FA"/>

  <text x="75" y="100" font-family="Arial, sans-serif" font-size="18" fill="#FF6FA5">&#10022;</text>
  <text x="310" y="300" font-family="Arial, sans-serif" font-size="16" fill="#1AC0CE">&#10022;</text>

  <!-- vnější kroužek kompasu -->
  <circle cx="200" cy="200" r="120" fill="#FFFFFF" stroke="#14233A" stroke-width="9"/>
  <circle cx="200" cy="200" r="96" fill="none" stroke="#14233A" stroke-width="3" opacity="0.4"/>

  <!-- rysky -->
  <line x1="200" y1="90" x2="200" y2="104" stroke="#14233A" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="296" x2="200" y2="310" stroke="#14233A" stroke-width="6" stroke-linecap="round"/>
  <line x1="90" y1="200" x2="104" y2="200" stroke="#14233A" stroke-width="6" stroke-linecap="round"/>
  <line x1="296" y1="200" x2="310" y2="200" stroke="#14233A" stroke-width="6" stroke-linecap="round"/>

  <!-- střelka -->
  <path d="M200 130 L228 200 L200 190 L172 200 Z" fill="#FF6FA5" stroke="#14233A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M200 270 L172 200 L200 210 L228 200 Z" fill="#1AC0CE" stroke="#14233A" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="200" cy="200" r="10" fill="#FFD23F" stroke="#14233A" stroke-width="3"/>

  <!-- N -->
  <text x="200" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#14233A">N</text>
</svg>
