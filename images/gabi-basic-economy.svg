<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Gábi u nástupní brány, překvapená/rozhozená gestem, vedle ní malý
       kufřík s křížkem (nesmí do kabiny). Stejná postava jako
       gabi-happy-plaz.svg (hlava r=76 na (200,178), stejná kšiltovka),
       jen jiné paže, výraz a rekvizita. Pozadí je průhledné, scéna
       oříznutá do kolečka. -->

  <clipPath id="beKolo"><circle cx="200" cy="200" r="185"/></clipPath>

  <g clip-path="url(#beKolo)">
    <!-- stěna terminálu -->
    <rect x="0" y="0" width="400" height="400" fill="#E3EAEE"/>
    <rect x="0" y="0" width="400" height="230" fill="#F4FBFC"/>
    <!-- okno na letovou plochu -->
    <rect x="240" y="30" width="130" height="150" rx="8" fill="#CDEFF3"/>
    <rect x="240" y="30" width="130" height="150" rx="8" fill="none" stroke="#B9C6CE" stroke-width="6"/>
    <path d="M250 168 L310 60 L360 168 Z" fill="#F4FBFC" opacity="0.7"/>

    <!-- podlaha -->
    <rect x="0" y="230" width="400" height="170" fill="#CBD6DE"/>

    <!-- levá paže dole podél těla -->
    <g fill="none" stroke-linecap="round">
      <path d="M148 274 Q126 310 140 350" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M148 274 Q126 310 140 350" stroke="#FFE0CC" stroke-width="20"/>
    </g>
    <circle cx="140" cy="352" r="16" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>

    <!-- pravá paže nahoru a od hlavy, dlaň ven, gesto "počkat, cože?" -->
    <g fill="none" stroke-linecap="round">
      <path d="M252 274 Q312 224 330 112" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M252 274 Q312 224 330 112" stroke="#FFE0CC" stroke-width="20"/>
    </g>
    <circle cx="330" cy="104" r="17" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>

    <!-- tělo: tričko -->
    <path d="M118 385 L118 302 Q118 254 166 252 L234 252 Q282 254 282 302 L282 385 Z" fill="#1AC0CE"/>
    <path d="M176 254 L200 292 L224 254 Z" fill="#F4FBFC"/>

    <!-- malý kufřík u nohou, blíž ke středu, s křížkem -->
    <g transform="translate(122 336)">
      <rect x="-30" y="-6" width="60" height="46" rx="6" fill="#FF6FA5"/>
      <rect x="-14" y="-16" width="28" height="14" rx="4" fill="none" stroke="#14233A" stroke-width="4"/>
      <circle cx="0" cy="17" r="13" fill="#FFFFFF" stroke="#14233A" stroke-width="3"/>
      <path d="M-6 11 L6 23 M6 11 L-6 23" stroke="#C4275A" stroke-width="3.4" stroke-linecap="round"/>
    </g>

    <!-- vlasy -->
    <path d="M200 88 Q286 88 288 186 Q290 248 272 276 Q256 254 262 206 Q262 138 200 134
             Q138 138 138 206 Q144 254 128 276 Q110 248 112 186 Q114 88 200 88 Z" fill="#2A3550"/>

    <!-- hlava -->
    <circle cx="200" cy="178" r="76" fill="#FFE0CC"/>

    <!-- kšiltovka -->
    <clipPath id="beKstil"><path d="M116 130 Q116 58 200 58 Q284 58 284 130 Z"/></clipPath>
    <g clip-path="url(#beKstil)">
      <rect x="104" y="58" width="192" height="22" fill="#F4FBFC"/>
      <rect x="104" y="80" width="192" height="13" fill="#FF6FA5"/>
      <rect x="104" y="93" width="192" height="6"  fill="#FFD23F"/>
      <rect x="104" y="99" width="192" height="13" fill="#F4FBFC"/>
      <rect x="104" y="112" width="192" height="18" fill="#1AC0CE"/>
    </g>
    <path d="M116 130 Q116 58 200 58 Q284 58 284 130" fill="none" stroke="#14233A" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="200" cy="62" r="6" fill="#14233A"/>
    <path d="M108 128 Q200 172 292 128 Z" fill="#0E8C97" stroke="#14233A" stroke-width="3" stroke-linejoin="round"/>

    <!-- obočí zvednuté, překvapení -->
    <path d="M148 152 Q168 138 188 152" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M252 152 Q232 138 212 152" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- oči doširoka otevřené, bez brýlí -->
    <circle cx="168" cy="188" r="8" fill="#14233A"/>
    <circle cx="232" cy="188" r="8" fill="#14233A"/>

    <!-- pusa dokořán, "cože?" -->
    <ellipse cx="200" cy="228" rx="16" ry="18" fill="#14233A"/>
    <ellipse cx="200" cy="224" rx="10" ry="10" fill="#FFFFFF"/>

    <!-- tváře -->
    <ellipse cx="146" cy="212" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>
    <ellipse cx="254" cy="212" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>
  </g>
</svg>
