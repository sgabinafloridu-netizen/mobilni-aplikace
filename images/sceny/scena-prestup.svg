<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Americký přestup: kufr, který si musíš vyzvednout, a tři hodiny, které na to potřebuješ.
       Stejná soustava jako zbytek sady: 400 × 400, kolečko r=185, tahy 7 a víc. -->
  <circle cx="200" cy="200" r="185" fill="#E6F8FA"/>
  <text x="72" y="104" font-family="Arial, sans-serif" font-size="18" fill="#FF6FA5">&#10022;</text>
  <text x="316" y="296" font-family="Arial, sans-serif" font-size="16" fill="#1AC0CE">&#10022;</text>

  <!-- pás na zavazadla -->
  <rect x="72" y="286" width="256" height="26" rx="13" fill="#14233A"/>
  <circle cx="108" cy="330" r="11" fill="#14233A" opacity="0.28"/>
  <circle cx="200" cy="330" r="11" fill="#14233A" opacity="0.28"/>
  <circle cx="292" cy="330" r="11" fill="#14233A" opacity="0.28"/>

  <!-- kufr na pásu -->
  <line x1="158" y1="218" x2="158" y2="190" stroke="#14233A" stroke-width="8" stroke-linecap="round"/>
  <line x1="214" y1="218" x2="214" y2="190" stroke="#14233A" stroke-width="8" stroke-linecap="round"/>
  <line x1="152" y1="190" x2="220" y2="190" stroke="#14233A" stroke-width="10" stroke-linecap="round"/>
  <rect x="134" y="218" width="104" height="70" rx="14" fill="#FF6FA5" stroke="#14233A" stroke-width="7"/>
  <rect x="134" y="244" width="104" height="13" fill="#FFF0F6" opacity="0.9"/>
  <rect x="242" y="206" width="26" height="18" rx="4" fill="#FFD23F" stroke="#14233A" stroke-width="4"/>
  <line x1="238" y1="206" x2="228" y2="222" stroke="#14233A" stroke-width="4" stroke-linecap="round"/>

  <!-- hodiny: aspoň tři hodiny na přestup -->
  <circle cx="288" cy="150" r="54" fill="#FFFFFF" stroke="#14233A" stroke-width="9"/>
  <line x1="288" y1="150" x2="288" y2="114" stroke="#14233A" stroke-width="8" stroke-linecap="round"/>
  <line x1="288" y1="150" x2="320" y2="150" stroke="#1AC0CE" stroke-width="8" stroke-linecap="round"/>
  <circle cx="288" cy="150" r="7" fill="#FFD23F" stroke="#14233A" stroke-width="3"/>
</svg>
