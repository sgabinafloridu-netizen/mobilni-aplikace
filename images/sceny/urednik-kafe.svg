<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect x="0" y="0" width="400" height="400" fill="#FFFFFF"/>
  <defs>
    <clipPath id="kolo3"><circle cx="200" cy="200" r="185"/></clipPath>
  </defs>
  <circle cx="200" cy="200" r="185" fill="#E6F8FA"/>

  <g clip-path="url(#kolo3)">
    <!-- hvězdičky -->
    <text x="56" y="76" font-family="Arial, sans-serif" font-size="22" fill="#FF6FA5">&#10022;</text>
    <text x="330" y="120" font-family="Arial, sans-serif" font-size="16" fill="#1AC0CE">&#10022;</text>

    <!-- myšlenka -->
    <text x="270" y="180" font-family="Arial, sans-serif" font-style="italic" font-size="16" fill="#14233A" transform="rotate(8 270 180)">ještě tři lidi&#8230;</text>

    <!-- tělo: uniforma -->
    <path d="M120 385 L120 310 Q120 262 168 258 L232 258 Q280 262 280 310 L280 385 Z" fill="#14233A"/>
    <!-- límec -->
    <path d="M178 260 L200 292 L222 260 Z" fill="#F4FBFC"/>
    <!-- nárameníky -->
    <rect x="124" y="262" width="30" height="10" rx="3" fill="#FFD23F"/>
    <rect x="246" y="262" width="30" height="10" rx="3" fill="#FFD23F"/>

    <!-- hlava -->
    <circle cx="200" cy="185" r="62" fill="#FFE0CC"/>

    <!-- čepice -->
    <path d="M142 158 Q150 108 200 106 Q250 108 258 158 Z" fill="#14233A"/>
    <rect x="136" y="154" width="128" height="18" rx="6" fill="#14233A"/>
    <path d="M148 172 Q200 192 252 172 L252 168 L148 168 Z" fill="#0D1830"/>
    <!-- odznak na čepici -->
    <circle cx="200" cy="136" r="11" fill="#FFD23F"/>
    <text x="200" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#14233A">&#9733;</text>

    <!-- spokojené zavřené oči -->
    <path d="M168 200 Q 176 194 184 200" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M216 200 Q 224 194 232 200" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- tváře -->
    <ellipse cx="156" cy="220" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>
    <ellipse cx="244" cy="220" rx="10" ry="6" fill="#FF6FA5" opacity="0.4"/>

    <!-- knírek a úsměv -->
    <path d="M184 226 Q 192 220 200 226 Q 208 220 216 226" stroke="#14233A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M186 238 Q200 248 214 238" stroke="#14233A" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- hrnek kafe (pravá ruka nahoře) -->
    <g>
      <path d="M296 244 Q314 256 296 272" stroke="#FFD23F" stroke-width="9" fill="none" stroke-linecap="round"/>
      <rect x="248" y="232" width="46" height="52" rx="8" fill="#FFD23F"/>
      <ellipse cx="271" cy="234" rx="20" ry="5" fill="#8A5A3B"/>
      <!-- pára -->
      <path d="M260 222 q 6 -9 0 -18" stroke="#9FB6C4" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M278 222 q 6 -9 0 -18" stroke="#9FB6C4" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- ruka drží hrnek -->
      <circle cx="252" cy="272" r="13" fill="#FFE0CC"/>
    </g>

    <!-- pult -->
    <rect x="0" y="330" width="400" height="80" fill="#1AC0CE"/>
    <rect x="0" y="330" width="400" height="9" fill="#3FD0DC"/>

    <!-- papír a razítko na pultě -->
    <g transform="rotate(-4 154 352)">
      <rect x="128" y="338" width="52" height="34" rx="3" fill="#FFFFFF" stroke="#14233A" stroke-width="2.5"/>
      <line x1="136" y1="348" x2="172" y2="348" stroke="#CFCFCF" stroke-width="3" stroke-linecap="round"/>
      <line x1="136" y1="358" x2="164" y2="358" stroke="#CFCFCF" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g>
      <circle cx="223" cy="326" r="7" fill="#14233A"/>
      <rect x="218" y="330" width="10" height="10" fill="#14233A"/>
      <rect x="208" y="338" width="30" height="12" rx="3" fill="#14233A"/>
    </g>

    <!-- levá ruka na pultě -->
    <circle cx="118" cy="334" r="13" fill="#FFE0CC"/>
  </g>
</svg>
