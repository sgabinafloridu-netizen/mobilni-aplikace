<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Gábi píše svůj příběh. Stejná postava jako gabi-happy-plaz.svg (hlava r=76
       na (200,178), stejná kšiltovka, stejné sluneční brýle, stejná pusa),
       jen jiná rekvizita a nálada: klidnější, ruce dole u zápisníku a pera,
       místo hurá gesta na pláži. Pozadí teplé, ne mořské, ať jde vidět rozdíl
       od "na pláž" nálady happy-plaz. -->

  <clipPath id="piseKolo"><circle cx="200" cy="200" r="185"/></clipPath>

  <g clip-path="url(#piseKolo)">
    <!-- teplé pozadí, klidný večerní odstín místo moře -->
    <rect x="0" y="0" width="400" height="400" fill="#FFF3E4"/>
    <circle cx="316" cy="90" r="26" fill="#FFD23F" opacity="0.85"/>

    <!-- ruce dole, jedna drží zápisník, druhá pero -->
    <g fill="none" stroke-linecap="round">
      <path d="M150 274 Q120 300 118 322" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M250 274 Q270 296 234 306" stroke="#E9C6AB" stroke-width="26"/>
      <path d="M150 274 Q120 300 118 322" stroke="#FFE0CC" stroke-width="20"/>
      <path d="M250 274 Q270 296 234 306" stroke="#FFE0CC" stroke-width="20"/>
    </g>
    <circle cx="118" cy="326" r="17" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>
    <circle cx="232" cy="308" r="15" fill="#FFE0CC" stroke="#E9C6AB" stroke-width="3"/>

    <!-- tělo: tričko -->
    <path d="M118 385 L118 302 Q118 254 166 252 L234 252 Q282 254 282 302 L282 385 Z" fill="#1AC0CE"/>
    <path d="M176 254 L200 292 L224 254 Z" fill="#F4FBFC"/>
    <text x="200" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold"
          font-size="13" letter-spacing="-0.2" fill="#FFFFFF">www.sgabinafloridu.cz</text>

    <!-- vlasy -->
    <path d="M200 88 Q286 88 288 186 Q290 248 272 276 Q256 254 262 206 Q262 138 200 134
             Q138 138 138 206 Q144 254 128 276 Q110 248 112 186 Q114 88 200 88 Z" fill="#2A3550"/>

    <!-- hlava -->
    <circle cx="200" cy="178" r="76" fill="#FFE0CC"/>

    <!-- kšiltovka, stejná jako happy-plaz -->
    <clipPath id="piseKstil"><path d="M116 130 Q116 58 200 58 Q284 58 284 130 Z"/></clipPath>
    <g clip-path="url(#piseKstil)">
      <rect x="104" y="58" width="192" height="22" fill="#F4FBFC"/>
      <rect x="104" y="80" width="192" height="13" fill="#FF6FA5"/>
      <rect x="104" y="93" width="192" height="6"  fill="#FFD23F"/>
      <rect x="104" y="99" width="192" height="13" fill="#F4FBFC"/>
      <rect x="104" y="112" width="192" height="18" fill="#1AC0CE"/>
    </g>
    <path d="M116 130 Q116 58 200 58 Q284 58 284 130" fill="none" stroke="#14233A" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="200" cy="62" r="6" fill="#14233A"/>
    <path d="M108 128 Q200 172 292 128 Z" fill="#0E8C97" stroke="#14233A" stroke-width="3" stroke-linejoin="round"/>

    <!-- obočí, soustředěné, mírně dolů -->
    <path d="M150 158 Q168 166 186 160" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M250 158 Q232 166 214 160" stroke="#14233A" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- sluneční brýle, stejné jako happy-plaz -->
    <line x1="142" y1="182" x2="126" y2="178" stroke="#14233A" stroke-width="6" stroke-linecap="round"/>
    <line x1="258" y1="182" x2="274" y2="178" stroke="#14233A" stroke-width="6" stroke-linecap="round"/>
    <rect x="141" y="174" width="56" height="38" rx="17" fill="#14233A"/>
    <rect x="203" y="174" width="56" height="38" rx="17" fill="#14233A"/>
    <line x1="197" y1="184" x2="203" y2="184" stroke="#14233A" stroke-width="7"/>
    <path d="M152 180 L165 180 L150 204 L143 196 Z" fill="#FFFFFF" opacity="0.32"/>
    <path d="M214 180 L227 180 L212 204 L205 196 Z" fill="#FFFFFF" opacity="0.32"/>

    <!-- pusa, klidný soustředěný úsměv, ne dokořán -->
    <path d="M176 222 Q200 236 224 222" stroke="#14233A" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- tváře -->
    <ellipse cx="140" cy="222" rx="11" ry="7" fill="#FF6FA5" opacity="0.4"/>
    <ellipse cx="260" cy="222" rx="11" ry="7" fill="#FF6FA5" opacity="0.4"/>

    <!-- zápisník a pero, kreslené jako poslední, ať jsou navrchu, ne pod tričkem -->
    <g transform="rotate(-8 118 326)">
      <rect x="86" y="304" width="64" height="46" rx="4" fill="#F4FBFC" stroke="#14233A" stroke-width="3"/>
      <line x1="96" y1="318" x2="140" y2="318" stroke="#9FD9DE" stroke-width="3"/>
      <line x1="96" y1="328" x2="140" y2="328" stroke="#9FD9DE" stroke-width="3"/>
      <line x1="96" y1="338" x2="124" y2="338" stroke="#9FD9DE" stroke-width="3"/>
    </g>
    <g transform="rotate(38 232 308)">
      <rect x="228" y="270" width="9" height="52" rx="4" fill="#FF6FA5"/>
      <path d="M228 322 L232 334 L237 322 Z" fill="#14233A"/>
      <rect x="228" y="270" width="9" height="10" rx="3" fill="#14233A"/>
    </g>
  </g>

  <!-- hvězdičky -->
  <text x="52" y="120" font-family="Arial, sans-serif" font-size="16" fill="#1AC0CE">&#10022;</text>
  <text x="348" y="150" font-family="Arial, sans-serif" font-size="14" fill="#1AC0CE">&#10022;</text>
</svg>
